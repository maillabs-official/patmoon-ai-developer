name: PATMOON Virtual Simulation
on:
  workflow_dispatch:
  push:
    paths:
      - '*.py'
      - '.github/workflows/simulate.yml'
  schedule:
    - cron: '0 23 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -v
      - name: Virtual simulation
        run: python simulator.py > report.json
      - name: Public trend report
        run: python daily_report.py > trends.txt
      - name: Optional Telegram simulation report
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_report.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: patmoon-virtual-reports
          path: |
            report.json
            trends.txt
